name: Android release preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Unit and production dependency checks
        run: |
          npm test
          npm audit --omit=dev --audit-level=high
      - name: Generate branding and sync Android
        run: npm run android:sync
      - name: Android lint, tests, APK and bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew lintRelease testReleaseUnitTest assembleRelease bundleRelease
      - name: Upload unsigned review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ivory-mahjong-unsigned-android-release
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/reports/lint-results-release.html

